<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; gap: 90px; padding: 0 120px; }
  h1 { font-size: 64px; line-height: 1.25; font-weight: 800; margin-bottom: 28px; }
  p { font-size: 24px; line-height: 1.7; margin-bottom: 36px; }
  .pills { display: flex; gap: 12px; flex-wrap: wrap; }
</style></head>
<body>
  <div>
    <h1><span class="grad" data-t="heroTitle"></span></h1>
    <p class="muted" data-t="heroSub"></p>
    <div class="pills">
      <span class="pill" data-t="pill1"></span>
      <span class="pill" data-t="pill2"></span>
      <span class="pill" data-t="pill3"></span>
    </div>
  </div>
  <div class="strip">
    <div class="row active"><i></i>GitHub — pull requests</div>
    <div class="row"><i></i><span data-t="rowNotes"></span></div>
    <div class="row"><i></i>Stack Overflow</div>
    <div class="row"><i></i>MDN Web Docs</div>
    <div class="row"><i></i>Chrome Developers</div>
    <div class="limit"><span data-t="stripLimit"></span></div>
    <div class="row swept"><i></i><span data-t="rowOld"></span></div>
    <div class="row swept"><i></i><span data-t="rowOld"></span></div>
    <div class="row swept"><i></i><span data-t="rowOld"></span></div>
  </div>
<script src="strings.js"></script><script src="i18n.js"></script>
</body></html>
