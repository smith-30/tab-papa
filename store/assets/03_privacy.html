<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 140px; text-align: center; }
  .lock { font-size: 84px; margin-bottom: 20px; }
  h1 { font-size: 56px; font-weight: 800; margin-bottom: 20px; }
  .lead { font-size: 22px; line-height: 1.8; margin-bottom: 44px; }
  .grid { display: flex; gap: 20px; }
  .item { width: 250px; padding: 24px 20px; border-radius: 18px; background: #141418; border: 1px solid #2a2a33; }
  .item b { display: block; font-size: 20px; margin-bottom: 8px; }
  .item span { font-size: 15px; line-height: 1.7; color: #a1a1aa; }
</style></head>
<body>
  <div class="lock">🔒</div>
  <h1><span class="grad" data-t="privTitle"></span></h1>
  <p class="lead muted" data-t="privLead"></p>
  <div class="grid">
    <div class="item"><b data-t="p1t"></b><span data-t="p1p"></span></div>
    <div class="item"><b data-t="p2t"></b><span data-t="p2p"></span></div>
    <div class="item"><b data-t="p3t"></b><span data-t="p3p"></span></div>
    <div class="item"><b data-t="p4t"></b><span data-t="p4p"></span></div>
  </div>
<script src="strings.js"></script><script src="i18n.js"></script>
</body></html>
