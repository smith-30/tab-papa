<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 140px; text-align: center; }
  .lock { font-size: 84px; margin-bottom: 20px; }
  h1 { font-size: 56px; font-weight: 800; margin-bottom: 20px; }
  .lead { font-size: 22px; line-height: 1.8; margin-bottom: 44px; }
  .grid { display: flex; gap: 20px; }
  .item { width: 250px; padding: 24px 20px; border-radius: 18px; background: #141418; border: 1px solid #2a2a33; }
  .item b { display: block; font-size: 20px; margin-bottom: 8px; }
  .item span { font-size: 15px; line-height: 1.7; color: #a1a1aa; }
</style></head>
<body>
  <div class="lock">🔒</div>
  <h1><span class="grad">データは端末の外に出ません</span></h1>
  <p class="lead muted">外部への通信は一切なし。<br>閲覧内容は保存も送信もしません。</p>
  <div class="grid">
    <div class="item"><b>通信なし</b><span>外部へ送信するコードを含みません</span></div>
    <div class="item"><b>最小限の権限</b><span>tabs / tabGroups / storage / alarms のみ</span></div>
    <div class="item"><b>設定だけ保存</b><span>保存するのは設定値のみ(端末内)</span></div>
    <div class="item"><b>MIT OSS</b><span>ソースコードは GitHub で公開</span></div>
  </div>
</body></html>
