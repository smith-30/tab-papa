<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { padding: 90px 110px; }
  h1 { font-size: 48px; font-weight: 800; text-align: center; margin-bottom: 12px; }
  .sub { text-align: center; font-size: 20px; margin-bottom: 64px; }
  .steps { display: flex; gap: 28px; }
  .card { flex: 1; padding: 32px 28px; border-radius: 22px; background: #141418; border: 1px solid #2a2a33; position: relative; }
  .card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; border-radius: 22px 22px 0 0; background: linear-gradient(90deg, #6366f1, #06b6d4); }
  .n { font-size: 15px; font-weight: 800; color: #22d3ee; margin-bottom: 14px; }
  .emoji { font-size: 44px; margin-bottom: 14px; }
  h2 { font-size: 26px; margin-bottom: 12px; }
  .card p { font-size: 17px; line-height: 1.75; color: #a1a1aa; }
  .tag { display: inline-block; margin-top: 18px; padding: 6px 12px; border-radius: 999px; font-size: 13px; background: rgba(34,211,238,.12); border: 1px solid rgba(34,211,238,.35); color: #67e8f9; }
  .foot { margin-top: 46px; text-align: center; font-size: 19px; }
</style></head>
<body>
  <h1><span class="grad" data-t="howTitle"></span></h1>
  <p class="sub muted" data-t="howSub"></p>
  <div class="steps">
    <div class="card"><div class="n">STEP 1</div><div class="emoji">🪟</div><h2 data-t="s1t"></h2>
      <p data-t="s1p"></p><span class="tag" data-t="s1tag"></span></div>
    <div class="card"><div class="n">STEP 2</div><div class="emoji">📏</div><h2 data-t="s2t"></h2>
      <p data-t="s2p"></p><span class="tag" data-t="s2tag"></span></div>
    <div class="card"><div class="n">STEP 3</div><div class="emoji">🧹</div><h2 data-t="s3t"></h2>
      <p data-t="s3p"></p><span class="tag" data-t="s3tag"></span></div>
  </div>
  <p class="foot muted" data-t="howFoot"></p>
<script src="strings.js"></script><script src="i18n.js"></script>
</body></html>
