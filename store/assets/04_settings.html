<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; gap: 110px; padding: 0 120px; }
  h1 { font-size: 54px; line-height: 1.3; font-weight: 800; margin-bottom: 26px; }
  p { font-size: 22px; line-height: 1.8; }
  /* 実画面のポップアップ(popup.<lang>.png は 2x。表示幅 368px、下の余白は切り落とす。内容の高さは ja 568px・en 584px(CSS px)) */
  .frame {
    width: 368px; height: 690px; overflow: hidden; border-radius: 18px;
    background: #09090b; border: 1px solid #2a2a33;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    flex: none;
  }
  .frame img { display: block; width: 368px; height: auto; }
</style></head>
<body>
  <div>
    <h1><span class="grad" data-t="setTitle"></span></h1>
    <p class="muted" data-t="setLead"></p>
  </div>
  <div class="frame"><img data-img="popup" alt="tab-papa popup"></div>
<script src="strings.js"></script><script src="i18n.js"></script>
</body></html>
