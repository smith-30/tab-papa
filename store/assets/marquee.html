<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { width: 1400px; height: 560px; display: flex; align-items: center; justify-content: center; gap: 100px; }

  h1 { font-size: 46px; line-height: 1.3; font-weight: 800; margin-bottom: 16px; }
  p { font-size: 22px; line-height: 1.7; }
  .strip { transform: scale(.82); transform-origin: center; }
</style></head>
<body>
  <div>
    <div class="brand"><img src="../../public/icons/icon-128.png" alt=""><span class="grad">tab-papa</span></div>
    <h1>縦タブがあふれる前に、<br>そっと片付ける。</h1>
    <p class="muted">Chrome の縦タブモード向け。<br>使っていない間に、開きすぎたタブを自動整理。</p>
  </div>
  <div class="strip">
    <div class="row active"><i></i>GitHub — pull requests</div>
    <div class="row"><i></i>設計メモ — Notion</div>
    <div class="row"><i></i>MDN Web Docs</div>
    <div class="limit"><span>表示範囲 × 80%</span></div>
    <div class="row swept"><i></i>古いタブ</div>
    <div class="row swept"><i></i>古いタブ</div>
  </div>
</body></html>
