<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { width: 1400px; height: 560px; display: flex; align-items: center; justify-content: center; gap: 100px; }
  .brand { font-size: 52px; margin-bottom: 18px; }
  .brand img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 46px; line-height: 1.3; font-weight: 800; margin-bottom: 16px; }
  p { font-size: 22px; line-height: 1.7; }
  .strip { transform: scale(.82); transform-origin: center; }
</style></head>
<body>
  <div>
    <div class="brand"><img src="../../public/icons/icon-128.png" alt=""><span class="grad">tab-papa</span></div>
    <h1 data-t="mqTitle"></h1>
    <p class="muted" data-t="mqSub"></p>
  </div>
  <div class="strip">
    <div class="row active"><i></i>GitHub — pull requests</div>
    <div class="row"><i></i><span data-t="rowNotes"></span></div>
    <div class="row"><i></i>MDN Web Docs</div>
    <div class="limit"><span data-t="stripLimit"></span></div>
    <div class="row swept"><i></i><span data-t="rowOld"></span></div>
    <div class="row swept"><i></i><span data-t="rowOld"></span></div>
  </div>
<script src="strings.js"></script><script src="i18n.js"></script>
</body></html>
